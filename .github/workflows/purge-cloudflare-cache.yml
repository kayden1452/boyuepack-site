name: Purge Cloudflare Cache

# 每次推送到 main，等本次提交的 Pages 构建完成后自动清理 Cloudflare 边缘缓存。
# 接入 Cloudflare 后边缘缓存拉到 30 天，不清缓存访客会看到旧版。
# 未配置 CF_API_TOKEN 时自动跳过，不报错、不影响部署。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  purge:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check token
        id: chk
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "CF_API_TOKEN 未配置，跳过缓存清理（站点仍正常部署）"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for Pages build of this commit
        if: steps.chk.outputs.skip == 'false'
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "手动触发，跳过构建等待"
            exit 0
          fi
          sha="${GITHUB_SHA:0:7}"
          for i in $(seq 1 20); do
            info=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds/latest")
            status=$(echo "$info" | jq -r '.status // empty')
            commit=$(echo "$info" | jq -r '.commit // empty')
            echo "poll $i: status=$status commit=${commit:0:7} target=$sha"
            if [ "$status" = "built" ] && [ "${commit:0:7}" = "$sha" ]; then
              echo "本次提交已完成部署"
              exit 0
            fi
            sleep 8
          done
          echo "等待超时，仍继续清缓存（宁可多清一次）"

      - name: Resolve zone id
        if: steps.chk.outputs.skip == 'false'
        id: zone
        run: |
          resp=$(curl -s -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=boyuepackaging.com")
          zid=$(echo "$resp" | jq -r '.result[0].id // empty')
          if [ -z "$zid" ]; then
            echo "未找到 boyuepackaging.com 的 zone，检查 token 权限（需 Zone:Read + Cache Purge）"
            echo "$resp" | head -c 400
            exit 1
          fi
          echo "zone=$zid" >> "$GITHUB_OUTPUT"
          echo "zone id resolved"

      - name: Purge everything
        if: steps.chk.outputs.skip == 'false'
        env:
          ZONE: ${{ steps.zone.outputs.zone }}
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' -o out.json
          ok=$(jq -r '.success' out.json)
          echo "purge success: $ok"
          jq -r '.errors[]?.message // empty' out.json | sed 's/^/error: /'
          [ "$ok" = "true" ] || exit 1
